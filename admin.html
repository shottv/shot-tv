<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administrador | Shot TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #03131d;
      color: white;
    }

    header {
      background: #061e2b;
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #12394a;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #ff1744;
    }

    .volver {
      color: white;
      text-decoration: none;
      background: #12394a;
      padding: 10px 16px;
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      margin-top: 0;
    }

    .subtitulo {
      color: #9eb5c1;
      margin-bottom: 30px;
    }

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .tarjeta {
      background: #082737;
      border: 1px solid #12516a;
      border-radius: 12px;
      padding: 20px;
    }

    .tarjeta .icono {
      font-size: 28px;
    }

    .tarjeta .numero {
      font-size: 32px;
      font-weight: bold;
      margin: 12px 0 5px;
    }

    .tarjeta .texto {
      color: #b4c8d1;
    }

    .seccion {
      background: #082737;
      border: 1px solid #12516a;
      border-radius: 12px;
      padding: 20px;
    }

    .peliculas-lista {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    .pelicula {
      background: #061e2b;
      border-radius: 8px;
      overflow: hidden;
    }

    .pelicula img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }

    .pelicula-info {
      padding: 10px;
    }

    .pelicula-titulo {
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pelicula-vistas {
      color: #8fc7dc;
      font-size: 13px;
      margin-top: 5px;
    }

    #mensaje {
      text-align: center;
      padding: 50px 20px;
      color: #b4c8d1;
    }

    .error {
      color: #ff8b8b !important;
    }

    @media (max-width: 850px) {
      .estadisticas {
        grid-template-columns: repeat(2, 1fr);
      }

      .peliculas-lista {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      header {
        padding: 14px;
      }

      main {
        padding: 20px 14px;
      }

      h1 {
        font-size: 24px;
      }

      .tarjeta {
        padding: 16px;
      }

      .tarjeta .numero {
        font-size: 26px;
      }

      .pelicula img {
        height: 210px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">▶ SHOT <span>TV</span></div>
    <a href="index.html" class="volver">← Volver a Shot TV</a>
  </header>

  <main>
    <h1>📊 Panel de Administrador</h1>
    <p class="subtitulo">Resumen general de Shot TV.</p>

    <div id="mensaje">⏳ Verificando acceso...</div>

    <div id="contenido" style="display: none;">

      <section class="estadisticas">

        <div class="tarjeta">
          <div class="icono">👥</div>
          <div class="numero" id="usuarios">-</div>
          <div class="texto">Usuarios registrados</div>
        </div>

        <div class="tarjeta">
          <div class="icono">🎁</div>
          <div class="numero" id="pruebas">-</div>
          <div class="texto">Pruebas activas</div>
        </div>

        <div class="tarjeta">
          <div class="icono">💳</div>
          <div class="numero" id="suscripciones">-</div>
          <div class="texto">Suscripciones activas</div>
        </div>

        <div class="tarjeta">
          <div class="icono">🎬</div>
          <div class="numero" id="peliculas">-</div>
          <div class="texto">Películas en catálogo</div>
        </div>

      </section>

      <section class="seccion">
        <h2>🏆 Películas más vistas</h2>

        <div id="peliculasMasVistas" class="peliculas-lista"></div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://akpsjzcuimlwvehbammq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_23vVIVgRZbhBHm2xCbcczg_Zdg12tMn";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const mensaje = document.getElementById("mensaje");
    const contenido = document.getElementById("contenido");

    function mostrarError(texto) {
      mensaje.textContent = texto;
      mensaje.classList.add("error");
      mensaje.style.display = "block";
      contenido.style.display = "none";
    }

    function escaparHtml(valor) {
      return String(valor ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[c]));
    }

    async function cargarPanel() {
      try {
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("Tiempo de espera agotado")), 8000)
        );

        const cargar = async () => {
          const { data: sessionData, error: sessionError } = await db.auth.getSession();
          if (sessionError) throw sessionError;
          if (!sessionData.session) throw new Error("INICIAR_SESION");

          // Primero usamos la función de Supabase creada para verificar administradores.
          // Esto permite validar el acceso aunque la tabla admin_users tenga RLS activado.
          let autorizado = false;

          try {
            const { data: adminRpc, error: rpcError } = await db.rpc("is_admin");
            if (!rpcError && adminRpc === true) {
              autorizado = true;
            }
          } catch (e) {
            console.warn("No se pudo verificar con is_admin:", e);
          }

          // Como respaldo, comprobamos directamente la tabla.
          if (!autorizado) {
            const { data: adminData, error: adminError } = await db
              .from("admin_users")
              .select("user_id")
              .eq("user_id", sessionData.session.user.id)
              .limit(1);

            if (!adminError && adminData && adminData.length > 0) {
              autorizado = true;
            }
          }

          if (!autorizado) throw new Error("SIN_PERMISO");

          const [pruebasRes, suscripcionesRes, peliculasRes, topRes] = await Promise.all([
            db.from("shottv_pruebas").select("user_id", { count: "exact" }).eq("estado", "activa"),
            db.from("shottv_suscripciones").select("user_id", { count: "exact" }).eq("estado", "activa"),
            db.from("peliculas").select("id", { count: "exact", head: true }),
            db.from("peliculas").select("titulo, portada, vistas").order("vistas", { ascending: false }).limit(5)
          ]);

          for (const resultado of [pruebasRes, suscripcionesRes, peliculasRes, topRes]) {
            if (resultado.error) throw resultado.error;
          }

          const usuariosUnicos = new Set();
          (pruebasRes.data || []).forEach(x => x.user_id && usuariosUnicos.add(x.user_id));
          (suscripcionesRes.data || []).forEach(x => x.user_id && usuariosUnicos.add(x.user_id));

          return {
            usuarios: usuariosUnicos.size,
            pruebas: pruebasRes.count ?? (pruebasRes.data || []).length,
            suscripciones: suscripcionesRes.count ?? (suscripcionesRes.data || []).length,
            peliculas: peliculasRes.count ?? 0,
            top: topRes.data || []
          };
        };

        const datos = await Promise.race([cargar(), timeout]);

        document.getElementById("usuarios").textContent = datos.usuarios;
        document.getElementById("pruebas").textContent = datos.pruebas;
        document.getElementById("suscripciones").textContent = datos.suscripciones;
        document.getElementById("peliculas").textContent = datos.peliculas;

        const lista = document.getElementById("peliculasMasVistas");
        if (!datos.top.length) {
          lista.innerHTML = "<p style='color:#b4c8d1'>Aún no hay películas para mostrar.</p>";
        } else {
          lista.innerHTML = datos.top.map((pelicula, indice) => `
            <article class="pelicula">
              ${pelicula.portada
                ? `<img src="${escaparHtml(pelicula.portada)}" alt="${escaparHtml(pelicula.titulo || "Película")}" onerror="this.style.display='none'">`
                : `<div style="height:190px;display:flex;align-items:center;justify-content:center;color:#9eb5c1">Sin portada</div>`}
              <div class="pelicula-info">
                <div class="pelicula-titulo">${indice + 1}. ${escaparHtml(pelicula.titulo || "Sin título")}</div>
                <div class="pelicula-vistas">👁️ ${Number(pelicula.vistas || 0)} vistas</div>
              </div>
            </article>
          `).join("");
        }

        mensaje.style.display = "none";
        contenido.style.display = "block";
      } catch (error) {
        console.error("Error cargando el panel:", error);
        if (error.message === "INICIAR_SESION") {
          mostrarError("🔐 Debes iniciar sesión en Shot TV antes de abrir este panel.");
        } else if (error.message === "SIN_PERMISO") {
          mostrarError("⛔ Tu cuenta no está autorizada como administradora.");
        } else if (error.message === "Tiempo de espera agotado") {
          mostrarError("⚠️ La conexión tardó demasiado. Actualiza la página e inténtalo nuevamente.");
        } else {
          mostrarError("⚠️ No fue posible cargar el panel: " + (error.message || "Error desconocido"));
        }
      }
    }

    cargarPanel();
  </script>

  <script>
    /*
      PASO SIGUIENTE:
      Aquí conectaremos esta página con tu mismo proyecto de Supabase.
      No coloques todavía nuevas claves si no es necesario.
    */
  </script>

</body>
</html>
