<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shot TV</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo">▶ Shot TV</div>
  <nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#admin" id="adminLink">Administrar</a>
  </nav>
  <div class="ad-banner" id="adBanner" aria-label="Publicidad"><span>PUBLICIDAD</span></div>
  <input id="buscar" type="search" placeholder="Buscar película...">
</header>

<main>
  <section id="catalogo">
    <h1>🎬 Películas</h1>
    <div id="estado" class="estado">Cargando catálogo...</div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="admin" class="admin hidden">
    <div id="loginBox">
      <h2>🔐 Administrar</h2>
      <div class="loginform">
        <label>Correo<input id="loginEmail" type="email" autocomplete="username"></label>
        <label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password"></label>
        <button id="loginBtn">INICIAR SESIÓN</button>
      </div>
      <div id="loginMsg" class="mensaje"></div>
    </div>

    <div id="adminPanel" class="hidden">
      <div class="adminTop">
        <div>
          <h2>➕ Agregar película</h2>
          <p class="subtexto">Administrador conectado.</p>
        </div>
        <button id="logoutBtn" class="logout">CERRAR SESIÓN</button>
      </div>
      <div class="form">
        <label>Título<input id="titulo" type="text"></label>
        <label>Año<input id="anio" type="number" value="2026"></label>
        <label>Género<input id="genero" type="text" placeholder="Drama"></label>
        <label>Portada<input id="portada" type="file" accept="image/*"></label>
        <label class="full">🔗 Direct Link (streaming)
          <input id="url" type="url" placeholder="https://www.opendrive.com/...">
        </label>
        <label class="full add-first-option"><input id="ponerPrimero" type="checkbox" checked> 📌 Colocar esta película al principio del catálogo</label>
        <button id="agregar">AGREGAR PELÍCULA</button>
      </div>
      <div id="adminMsg" class="mensaje"></div>

      <hr class="admin-sep">
      <div class="ad-admin">
        <h2>📢 Administrar publicidad</h2>
        <p class="subtexto">Coloca una imagen y, opcionalmente, el enlace al que llevará el anuncio.</p>
        <div class="form">
          <label>Banner publicitario<input id="adFile" type="file" accept="image/*"></label>
          <label>Enlace del anuncio<input id="adLink" type="url" placeholder="https://..."></label>
          <label class="ad-check"><span>Publicidad activa</span><input id="adActivo" type="checkbox" checked></label>
          <button id="guardarAd">GUARDAR PUBLICIDAD</button>
        </div>
        <div id="adAdminMsg" class="mensaje"></div>
        <div id="adActual" class="ad-actual"></div>
      </div>
    </div>
  </section>
</main>

<div id="editModal" class="edit-modal">
  <div class="editbox">
    <button id="cerrarEdicion" class="close">✕</button>
    <h2>✏️ Editar película</h2>
    <div class="form editform">
      <label>Título<input id="editTitulo" type="text"></label>
      <label>Año<input id="editAnio" type="number"></label>
      <label>Género<input id="editGenero" type="text"></label>
      <label class="full">🔗 Direct Link (streaming)
        <input id="editUrl" type="url">
      </label>
      <label class="full">Portada nueva (opcional)<input id="editPortada" type="file" accept="image/*"></label>
      <button id="guardarEdicion">GUARDAR CAMBIOS</button>
    </div>
    <div id="editMsg" class="mensaje"></div>
  </div>
</div>

<div id="modal" class="modal">
  <div class="playerbox">
    <button id="cerrar" class="close">✕</button>
    <button id="pantalla" class="fullscreen-btn" type="button" title="Pantalla completa">⛶</button>
    <h2 id="ptitulo"></h2>
    <video id="player" controls controlsList="nofullscreen" autoplay playsinline preload="metadata"></video>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
